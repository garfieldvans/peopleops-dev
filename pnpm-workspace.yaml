packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  argon2: true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  "@scarf/scarf": false
  '@parcel/watcher': false

minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.15"
  - "@nestjs/common@12.6.0"
  - "@nestjs/core@12.6.0"
  - "@nestjs/platform-express@12.6.0"
  - "@tanstack/query-core@5.108.2"
  - "@tanstack/react-query@5.108.2"
  - '@nestjs/testing@12.6.0'
  - '@hookform/resolvers@7.0.8'
